<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修仙錄</title>
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cubic11";src:url("fonts/Cubic_11.woff2") format("woff2");font-display:swap}
/* Layout: pixel-RPG night lab. Semester HUD on top, tabs below; every panel uses a stepped pixel border (box-shadow cross). Deliberately single dark theme. */
:root{
  --bg:#14112a; --panel:#221d3f; --panel2:#2c2650; --edge:#4a3f7a; --ink:#f4efe1; --dim:#a99fc9;
  --gold:#f2c14e; --jade:#4fd1a1; --blood:#ef5d5d; --mist:#7fb2ff; --beam:#ff3b5c;
  --f:"Cubic11","PingFang TC","Microsoft JhengHei",monospace;
  --pb:3px;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.75;-webkit-font-smoothing:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.appc{display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mist);outline-offset:4px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
p{margin:0}

/* pixel border */
.box,.stat,.place,.mcard,.act,.btn,.node,.ovb,.pick button,.sum div,.week div,.login input,.filters button,.tabs button,.tag,.sched div,.scene.big{
  --c:var(--edge);border:0;
  box-shadow:0 calc(-1*var(--pb)) 0 0 var(--c),0 var(--pb) 0 0 var(--c),calc(-1*var(--pb)) 0 0 0 var(--c),var(--pb) 0 0 0 var(--c),var(--ins,0 0 0 0 transparent);}
.tag,.sched div{--pb:2px}

.top{display:flex;flex-direction:column;gap:12px;text-align:center}
.sect{color:var(--dim);letter-spacing:.3em;font-size:12px}
.date{font-size:36px;line-height:1.3;color:var(--gold);text-shadow:3px 3px 0 #5a3d0c}
.date small{display:block;font-size:12px;color:var(--dim);text-shadow:none;letter-spacing:.1em}
.me{font-size:16px;color:var(--mist);display:flex;justify-content:center;align-items:flex-end;gap:8px}
.tl{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;padding-top:6px}
.tl div{height:9px;background:var(--edge);position:relative}
.tl div.past{background:#8a6a24}.tl div.now{background:var(--gold)}
.tl div.ev::after{content:"";position:absolute;left:50%;top:-6px;width:3px;height:3px;background:var(--beam);transform:translateX(-50%)}
.tll{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;font-size:12px;color:var(--dim);white-space:nowrap;text-align:left}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;padding:3px}
.week div{background:var(--panel);padding:6px 2px;font-size:12px;text-align:center;line-height:1.5}
.week div b{display:block;font-size:16px;font-weight:400}
.week div.past{opacity:.4}.week div.now{--c:var(--gold);background:var(--panel2);color:var(--gold)}
.week i{font-style:normal;font-size:12px;color:var(--beam)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:3px}
.stat{background:var(--panel);padding:8px 12px;min-width:0}
.stat span{font-size:12px;color:var(--dim)}
.stat b{display:block;font-weight:400;font-size:24px;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:6px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar div{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 8px)}
.tabs{display:flex;gap:12px;flex-wrap:wrap;padding:3px}
.tabs button{background:var(--panel);padding:6px 14px;font-size:16px;color:var(--dim)}
.tabs button[aria-selected="true"]{--c:var(--gold);background:var(--gold);color:var(--bg)}
.box{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;margin:3px}
.box h2{font-size:24px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.3}
.box h2 em{font-style:normal;font-size:12px;color:var(--dim)}
.box h3{font-size:16px;color:var(--dim)}
.muted{color:var(--dim);font-size:12px;line-height:1.8}
.scene{display:block;width:100%;height:auto;aspect-ratio:2/1;max-width:100%}
.scene.big{max-width:512px;align-self:center;margin:3px auto}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:3px}
.place{text-align:left;background:var(--panel2);padding:0 0 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.place>*:not(canvas){padding-inline:10px}
.place canvas{margin-bottom:4px}
.place:hover{--c:var(--gold)}
.place b{font-weight:400;font-size:16px;color:var(--gold)}
.place span{font-size:12px;color:var(--dim);line-height:1.6}
.place .who{color:var(--mist)}
.main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.mcard{background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:10px;margin:3px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.mname{display:flex;align-items:flex-end;gap:10px}
.mname b{font-weight:400;font-size:16px;color:var(--ink)}
.mcard .spr{animation:bob 1.2s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.spr{display:inline-block;flex:none}
.tag{display:inline-block;font-size:12px;padding:0 6px;color:var(--dim);white-space:nowrap;margin:2px;line-height:1.6;background:var(--bg)}
.tag.pqs{--c:#e07b39;color:#f0a77a}.tag.aqs{--c:#4f7be0;color:#a9bbff}.tag.raman{--c:#3fb27f;color:#86dcbb}
.tag.share{--c:var(--gold);color:var(--gold)}.tag.ext{--c:#8f6ad8;color:#c8b2f2}
.acts{display:flex;flex-direction:column;gap:10px;padding:3px}
.act{text-align:left;background:var(--panel);padding:8px 12px;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;--ins:inset 0 -3px 0 0 rgba(0,0,0,.3)}
.act:hover:not(:disabled){--c:var(--gold)}
.act:active:not(:disabled){transform:translateY(2px)}
.act:disabled{opacity:.45;cursor:default}
.act small{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:600px){.act small{white-space:normal;text-align:right;min-width:0;flex:0 1 auto;overflow-wrap:anywhere}.act{min-width:0}}
.lock{font-size:12px;color:var(--dim);line-height:1.8}
.away{font-size:12px;color:var(--dim);border-left:3px solid var(--blood);padding-left:10px}
.btn{background:var(--panel2);--c:var(--gold);color:var(--gold);padding:8px 18px;font-size:16px;--ins:inset 0 -3px 0 0 rgba(0,0,0,.35);margin:3px}
.btn:hover:not(:disabled){background:#3a3166}
.btn:active:not(:disabled){transform:translateY(2px)}
.log{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--dim);margin:0;padding:0;list-style:none;line-height:1.8}
.log li{border-bottom:2px dashed var(--edge);padding-bottom:6px}
.log li b{color:var(--ink);font-weight:400}
.log time{color:var(--mist);margin-right:6px}
.filters{display:flex;gap:12px;flex-wrap:wrap;padding:3px}
.filters button{background:var(--panel2);padding:2px 12px;font-size:12px}
.filters button[aria-pressed="true"]{--c:var(--gold);color:var(--gold)}
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:3px}
.tier{display:flex;flex-direction:column;gap:12px;min-width:0}
.tier h3{font-size:12px;color:var(--dim);letter-spacing:.15em}
.node{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.7}
.node b{font-weight:400;font-size:16px;line-height:1.4}
.node.dim{opacity:.22}
.node.done{--c:var(--jade)}
.node.open{--c:var(--gold)}
.node .st.done{color:var(--jade)}.node .st.open{color:var(--gold)}.node .st.lockd{color:var(--dim)}
.node .pr{color:var(--dim)}
.node .tags{display:flex;flex-wrap:wrap;margin:2px -2px 0}
.masters{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;font-size:12px;text-align:center;padding:2px}
.sched div{background:var(--panel);padding:2px;line-height:1.6}
.sched div b{display:block;color:var(--dim);font-weight:400}
.sched div.today{--c:var(--gold)}
.aff{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.aff .bar{flex:1;margin:0}
.aff .bar div{background:repeating-linear-gradient(90deg,var(--mist) 0 6px,transparent 6px 8px)}
.teach{font-size:12px;color:var(--dim);line-height:1.8}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,8,22,.9);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovb{--c:var(--gold);width:min(620px,calc(100% - 6px));max-height:calc(100% - 6px);overflow-y:auto;background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px}
.ovb h1{font-size:24px;color:var(--gold);text-align:center;line-height:1.4}
.ovb h2{font-size:16px;color:var(--ink);font-weight:400}
.hero{display:flex;justify-content:center}
.pick{display:flex;flex-direction:column;gap:14px;padding:3px}
.pick button{text-align:left;background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick button:hover{--c:var(--gold)}
.pick button.on{--c:var(--gold);background:var(--panel)}
.pickbar{position:sticky;bottom:-22px;justify-content:flex-end;margin-top:10px;padding:12px 0 18px;background:var(--panel)}
.hexwrap{display:flex;justify-content:center}.hex{max-width:100%;height:auto;overflow:visible}
.hex .hexn{fill:var(--gold);font-size:15px}.hex .hexs{fill:var(--mist);font-size:12px}
.hexlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}.hexlist div{display:flex;flex-direction:column}
.plain{font-size:12px;color:var(--dim);margin:0}
.realmsteps{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin-top:6px}.realmsteps .ok{color:var(--jade)}
.nextrealm{color:var(--gold);font-size:13px;margin:6px 0 0}
.trial{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--panel2);margin:6px 0}
.trial .ok,.trialcard .ok{color:var(--jade);margin:0}
.fb{border-left:3px solid var(--gold);padding:4px 10px}.fb p{margin:4px 0 0}
.trialcard{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px dashed var(--edge)}
.quote{margin:0;padding:6px 10px;background:var(--panel2);font-size:13px}
.chip.locked{opacity:.55;cursor:not-allowed}.chip.locked small{font-size:10px;color:var(--dim)}
.tag.title{--c:var(--gold);color:var(--gold)}.gold{color:var(--gold)}
.sgroup{margin-top:14px}.sgroup h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:15px;color:var(--mist)}.sgroup h3 em{font-style:normal;font-size:12px;color:var(--dim)}
.srows{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.srow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);padding:7px 10px;border:0;box-shadow:inset 3px 0 0 var(--edge);color:var(--ink);min-height:44px}
.srow:hover{background:var(--panel);box-shadow:inset 3px 0 0 var(--mist)}
.srow.done{box-shadow:inset 3px 0 0 var(--jade)}.srow.open{box-shadow:inset 3px 0 0 var(--gold)}.srow.lockd{opacity:.72}
.sdot{width:14px;flex:none;text-align:center;color:var(--dim)}.srow.done .sdot{color:var(--jade)}.srow.open .sdot{color:var(--gold)}
.sname{flex:1;display:flex;flex-direction:column;min-width:0}.sname b{font-weight:400}.sname small{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sname .need{color:var(--blood);opacity:.85}
.spips{display:flex;gap:3px;flex:none}.spips i{font-style:normal;font-size:11px;padding:1px 4px;box-shadow:inset 0 0 0 1px var(--edge);color:var(--dim)}.spips i.on{background:var(--mist);color:#14112a;box-shadow:none}
.legend{display:flex;gap:12px;font-size:12px;margin-left:auto}.legend i{font-style:normal;color:var(--dim)}.legend .done{color:var(--jade)}.legend .open{color:var(--gold)}
details.other summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;list-style:none;font-size:20px;color:var(--gold)}
details.other summary::before{content:'▸ ';color:var(--dim)}details.other[open] summary::before{content:'▾ '}details.other summary em{margin-left:auto;font-style:normal;font-size:12px;color:var(--dim)}
.sdone{font-size:12px;margin:0}
.plan{position:relative;width:100%;margin:6px auto 4px;background-color:#1a1630;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:14px 14px;box-shadow:inset 0 0 0 3px var(--edge)}
.otable{position:absolute;display:flex;flex-direction:column;background-color:#3b4152;background-image:radial-gradient(#5d6478 1px,transparent 1.6px);background-size:7px 7px;box-shadow:0 0 0 2px #0d0b1a,3px 4px 0 rgba(0,0,0,.45)}
.slot{flex:1;min-height:0;min-width:0;display:flex;align-items:center;gap:4px;padding:0 5px;border:0;background:rgba(20,17,42,.35);color:var(--ink);font-size:11px;line-height:1.1;text-align:left;box-shadow:inset 3px 0 0 var(--sc,var(--edge))}
.slot+.slot{border-top:1px dashed rgba(255,255,255,.18)}
.otable.sbs{flex-direction:row}.otable.sbs .slot+.slot{border-top:0;border-left:1px dashed rgba(255,255,255,.18)}
.otable.sbs .slot{flex:1 1 0;width:0;height:auto;align-self:stretch;margin:0;flex-direction:column;align-items:center;justify-content:center;padding:5px 0;box-shadow:inset 0 3px 0 var(--sc,var(--edge))}.otable.sbs .slot span{writing-mode:vertical-rl;max-height:100%}
.aisle{position:absolute;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(0deg,rgba(242,193,78,.07) 0 10px,transparent 10px 20px);box-shadow:inset 1px 0 0 rgba(242,193,78,.25),inset -1px 0 0 rgba(242,193,78,.25)}
.aisle span{writing-mode:vertical-rl;letter-spacing:.6em;font-size:12px;color:rgba(242,193,78,.6)}
.slot i{font-style:normal;flex:none;background:var(--sc,var(--edge));color:#14112a;padding:0 3px;font-size:10px}
.slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.slot:hover{background:rgba(127,178,255,.18)}
.slot.mine{background:rgba(242,193,78,.22);box-shadow:inset 3px 0 0 var(--sc),0 0 0 2px var(--gold)}
.slot.empty{color:var(--dim);justify-content:center}.slot.empty i{background:var(--edge);color:var(--ink)}
.slot .here{display:flex;gap:1px;margin-left:auto;flex:none}.slot .here canvas{width:14px!important;height:17px!important}
.curtain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.curtain polyline{fill:none;stroke:#0d0b1a;stroke-width:.14;stroke-dasharray:.25 .12;vector-effect:none}
.ctag{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:var(--dim);background:#1a1630;padding:0 3px}
.tag.dim{--c:var(--mist);color:var(--mist)}
.pick .tick{font-size:18px;color:var(--gold);margin-right:2px}
.pick b{font-weight:400;font-size:16px;color:var(--gold)}
.pick span{font-size:12px;color:var(--dim)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;padding:3px}
.sum div{background:var(--panel2);padding:10px}
.sum b{display:block;font-weight:400;font-size:24px;color:var(--gold)}
.sum span{font-size:12px;color:var(--dim)}
.gate{max-width:560px;width:calc(100% - 6px);margin:8vh auto 0;text-align:center;align-items:center}
.gate h1{font-size:36px;color:var(--gold);text-shadow:3px 3px 0 #5a3d0c}
.gate-art{width:100%;display:flex;justify-content:center}
.login{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;text-align:left}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
.login input{background:var(--bg);padding:8px 12px;font-size:16px;margin:3px}
.login input:focus{--c:var(--gold);outline:none}
.err{color:var(--blood);font-size:12px;min-height:1.5em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row input[type=file]{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:left;padding:8px 10px;border-bottom:2px dashed var(--edge);white-space:nowrap}

.ptable td:first-child{color:var(--ink);font-size:16px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12px}

@media (max-width:820px){.main{grid-template-columns:1fr}.tree{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.room,.chip,.sw,.bookopt,.dk.on{--c:var(--edge);border:0;box-shadow:0 calc(-1*var(--pb)) 0 0 var(--c),0 var(--pb) 0 0 var(--c),calc(-1*var(--pb)) 0 0 0 var(--c),var(--pb) 0 0 0 var(--c)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);box-shadow:0 -3px 0 0 var(--edge),0 -9px 0 0 rgba(10,8,22,.6);
  display:grid;grid-template-columns:repeat(6,minmax(0,110px));justify-content:center;gap:8px;

.ico{display:block}

.fbody{display:flex;flex-direction:column;min-width:0}

function hexChart(sc,size=300){const NS='http://www.w3.org/2000/svg';const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const W=size,cx=W/2,cy=W/2,R0=W*0.31,n=sc.length;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const svg=el('svg',{viewBox:`0 0 ${W} ${W}`,width:W,height:W,class:'hex',role:'img','aria-label':'能力六象：'+sc.map(d=>`${d.n}${d.sub} ${d.pct}%`).join('、')});

  sc.forEach((_,i)=>{const [x,y]=pt(i,R0);svg.append(el('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'var(--edge)','stroke-width':1}));});

  return svg;}
function hexBox(sc,title,note){return h('section',{class:'box'},h('h2',{},title||'能力六象',h('em',{},note||'依各象功法的「讀、問、做、成」計算')),

const STEPS=[{k:'read',n:'讀',d:'讀完藏經閣的讀物'},{k:'ask',n:'問',d:'向學長姐請教過'},{k:'do',n:'做',d:'實際操作過',practice:true},{k:'done',n:'成',d:'自評已經學會'}];

function closure(id,set=new Set()){if(set.has(id)||!SK[id])return set;set.add(id);SK[id].pre.forEach(p=>closure(p,set));return set;}
function rebuild(){SK=Object.fromEntries(SKILLS.map(s=>[s.id,s]));MS=Object.fromEntries(MASTERS.map(m=>[m.id,m]));
  const core=new Set();SKILLS.filter(s=>s.core).forEach(s=>closure(s.id,core));CORE=core;
  for(const k in SCHOOLS){const sc=SCHOOLS[k];const N=closure(sc.final);(sc.extra||[]).forEach(x=>closure(x,N));

function exportContent(){

function checkContent(c){const e=[];
  if(!c||typeof c!=='object')return['不是 JSON 物件'];
  for(const k of['places','schools','skills','masters'])if(!c[k])e.push('缺少 '+k);
  if(e.length)return e;
  const ids=new Set(c.skills.map(s=>s.id));
  c.skills.forEach(s=>{if(!s.id||!s.n)e.push('有功法缺少 id 或 n');(s.pre||[]).forEach(p=>{if(!ids.has(p))e.push(`功法 ${s.id} 的前置 ${p} 不存在`);});});
  for(const k in c.schools){if(!ids.has(c.schools[k].final))e.push(`派系 ${k} 的 final ${c.schools[k].final} 不存在`);(c.schools[k].extra||[]).forEach(x=>{if(!ids.has(x))e.push(`派系 ${k} 的額外功法 ${x} 不存在`);});}
  c.masters.forEach(m=>{(m.teach||[]).forEach(t=>{if(!ids.has(t))e.push(`師父 ${m.n} 教的 ${t} 不存在`);});
    for(const d in (m.sched||{})){const v=m.sched[d];(typeof v==='string'?[v]:Object.values(v||{})).forEach(x=>{if(x&&x!=='class'&&!c.places[x])e.push(`師父 ${m.n} 週${d} 的地點 ${x} 不存在`);});}
    if(m.school&&!c.schools[m.school])e.push(`師父 ${m.n} 的派系 ${m.school} 不存在`);});
  for(const k in (c.sects||{}))(c.sects[k].schools||[]).forEach(x=>{if(!c.schools[x])e.push(`宗門 ${k} 的派系 ${x} 不存在`);});
  if(c.semester&&isNaN(new Date(c.semester.start)))e.push('semester.start 的日期格式要像 2026-09-14');
  if(!e.length){const seen=new Set(),stack=new Set();const byId=Object.fromEntries(c.skills.map(s=>[s.id,s]));
    const dfs=id=>{if(stack.has(id))return e.push('功法前置形成循環：'+id);if(seen.has(id))return;stack.add(id);(byId[id].pre||[]).forEach(dfs);stack.delete(id);seen.add(id);};
    c.skills.forEach(s=>dfs(s.id));}
  return e;}

    const em=toEmail(a).toLowerCase();

  return box;

/* ===================== 初次選派系 ===================== */
function pickSect(){
  overlay((b,close)=>{
    b.append(h('h1',{},'拜入哪個宗門？'),h('p',{class:'muted'},'宗門就是你的指導老師。之後管理者也可以幫你調整。'));
    const p=h('div',{class:'pick'});
    for(const k in SECTS){const sc=SECTS[k];
      p.append(h('button',{onclick:()=>{S.sect=k;log(`拜入<b>${sc.n}</b>${sc.head?'，宗主是'+sc.head.n:''}。`);close();save();publish();render();if(!mySchool())pickSchool();}},
        h('span',{class:'mname'},sc.head?sprite(sc.head.look,4):null,h('b',{},sc.n)),h('span',{},`宗主：${sc.head?sc.head.n:'—'}`),sc.motto?h('span',{class:'motto'},sc.motto):null));}
    b.append(p);});
}
function pickSchoolsDlg(cur,title,done,sub){
  overlay((b,close)=>{const on=new Set(cur||[]);
    const sk=mySect();const list=sub&&sk&&Array.isArray(SECTS[sk].schools)&&SECTS[sk].schools.length?SECTS[sk].schools.filter(k=>SCHOOLS[k]):Object.keys(SCHOOLS);
    b.append(h('h1',{},title),h('p',{class:'muted'},sub||'可以多選，按「確定」儲存。都不選代表讓本人自己選。'));
    const p=h('div',{class:'pick'});const ok=h('button',{class:'btn'},'確定');
    const draw=()=>{p.replaceChildren(...list.map(k=>{const sc=SCHOOLS[k];const head=MASTERS.find(m=>m.school===k);const sel=on.has(k);
      return h('button',{class:sel?'on':'','aria-pressed':String(sel),onclick:()=>{sel?on.delete(k):on.add(k);draw();}},
        h('span',{class:'mname'},h('span',{class:'tick'},sel?'☑':'☐'),head?sprite(head.look,3):null,h('b',{},sc.en&&sc.en!==sc.n?`${sc.n}　${sc.en}`:sc.n)),h('span',{},sc.d||''),h('span',{},`功法 ${sc.need.size} 門`));}));
      ok.textContent=on.size?`確定（${on.size} 派，本派功法共 ${pathOf([...on]).length} 門）`:'確定';};draw();
    ok.onclick=()=>{const L=list.filter(k=>on.has(k)).concat([...on].filter(k=>!list.includes(k)));close();done(L);};
    b.append(p,h('div',{class:'row pickbar'},sub?null:h('button',{class:'btn',onclick:close},'取消'),ok));});
}
function pickSchool(){
  const sk=mySect();
  const go1=()=>pickSchoolsDlg(schoolsOf(S),'拜入哪些派系？',L=>{if(!L.length){go1();return;}S.schools=L;S.school=L[0];log(`拜入<b>${schoolNames(L)}</b>。`);save();publish();render();},
    `${sk?SECTS[sk].n+'底下的派系，':''}依你負責或想加入的實驗桌選，可以多選。本派功法是所有選到的派系功法合起來，決定境界。之後管理者也可以幫你調整。`);
  go1();
}

/* ===================== 帳號 ===================== */
function gate(t,d,form){$('gate').hidden=false;$('app').hidden=true;$('gate-t').textContent=t;$('gate-d').textContent=d;$('login').hidden=!form;}
const CFG=window.FIREBASE_CONFIG||{};
const DOMAIN=window.LOGIN_DOMAIN||'lab533.example.com';
const toEmail=u=>(u=u.trim(),u.includes('@')?u:u.toLowerCase()+'@'+DOMAIN);
const ERR={'auth/invalid-credential':'帳號或密碼不正確。','auth/wrong-password':'帳號或密碼不正確。','auth/user-not-found':'帳號或密碼不正確。',
  'auth/invalid-email':'帳號格式不正確。','auth/too-many-requests':'嘗試太多次，請稍後再試。','auth/network-request-failed':'網路連線失敗，請檢查網路。',
  'auth/user-disabled':'這個帳號已被停用，請找管理者。','auth/weak-password':'密碼至少要 6 個字元。','auth/requires-recent-login':'為了安全，請先登出再登入一次，然後馬上改密碼。'};
const DEFAULT_CONTENT=upgradeContent({...JSON.parse(JSON.stringify(exportContent())),rev:0});
$('gate-art').append(scene('lab',[SECTS.yf&&SECTS.yf.head?SECTS.yf.head.look:TEACHER,{hair:'#3b2a1f',robe:'#d8d2ea',belt:'#8a80a8'},SECTS.xc&&SECTS.xc.head?SECTS.xc.head.look:TEACHER],true));
function migrate(){
  if(!S.steps)S.steps={};
  if(S.learned&&typeof S.learned==='object'){for(const id in S.learned)if(S.learned[id]&&SK[id]&&!S.steps[id])S.steps[id]={read:true,ask:true,do:true,done:true};}
  ['learned','prog','aff','res','resSince','learnSince','meetings','week','day','place','ended'].forEach(k=>delete S[k]);
  for(const id in S.steps)if(!SK[id])delete S.steps[id];
  S.schools=schoolsOf(S);S.school=S.schools[0]||null;
  S.realmSeen=Math.max(S.realmSeen||0,myRealm().i);
}
if(!window.firebase||!CFG.apiKey||String(CFG.apiKey).startsWith('請')){gate('尚未完成設定','管理者還沒填好 firebase-config.js，請參考 README 的設定步驟。',false);}
else{
  firebase.initializeApp(CFG);const AUTH=firebase.auth(),FS=firebase.firestore();let UNSUB=[];
  $('login').onsubmit=async e=>{e.preventDefault();$('lg-err').textContent='';$('lg-btn').disabled=true;
    try{await AUTH.signInWithEmailAndPassword(toEmail($('lg-user').value),$('lg-pass').value);$('lg-pass').value='';}
    catch(err){$('lg-err').textContent=ERR[err.code]||('登入失敗（'+err.code+'）');}
    $('lg-btn').disabled=false;};
  $('logout').onclick=()=>AUTH.signOut();
  $('tab-admin').onclick=()=>go('admin');
  $('nick').onclick=()=>overlay((b,close)=>{
    const inp=h('input',{id:'nk',maxlength:'16'});inp.value=S.nick||ME_NAME;const er=h('p',{class:'err'});
    const f=h('form',{class:'login',style:'max-width:none'},h('label',{for:'nk'},'遊戲中顯示的名稱（道號），最多 16 字',inp),er,
      h('div',{class:'row'},h('button',{class:'btn',type:'submit'},'儲存'),h('button',{class:'link',type:'button',onclick:close},'取消')));
    f.onsubmit=async e=>{e.preventDefault();const v=inp.value.trim();if(!v){er.textContent='名稱不能空白。';return;}
      S.nick=v===ME_NAME?'':v;await save();close();render();};
    b.append(h('h1',{},'更改名稱'),h('p',{class:'muted'},`登入帳號仍是「${ME_NAME}」，這裡只改遊戲裡顯示的名字。`),f);});
  $('pw').onclick=()=>overlay((b,close)=>{
    const p1=h('input',{type:'password',id:'pw1',autocomplete:'new-password'}),p2=h('input',{type:'password',id:'pw2',autocomplete:'new-password'}),er=h('p',{class:'err'});
    const f=h('form',{class:'login',style:'max-width:none'},h('label',{for:'pw1'},'新密碼（至少 6 個字元）',p1),h('label',{for:'pw2'},'再輸入一次',p2),er,
      h('div',{class:'row'},h('button',{class:'btn',type:'submit'},'更改密碼'),h('button',{class:'link',type:'button',onclick:close},'取消')));
    f.onsubmit=async e=>{e.preventDefault();if(p1.value!==p2.value){er.textContent='兩次輸入的密碼不一樣。';return;}
      try{await AUTH.currentUser.updatePassword(p1.value);b.replaceChildren(h('h1',{},'密碼已更改'),h('button',{class:'btn',style:'align-self:center',onclick:close},'好'));}
      catch(err){er.textContent=ERR[err.code]||('更改失敗（'+err.code+'）');}};
    b.append(h('h1',{},'更改密碼'),f);});
  AUTH.onAuthStateChanged(async u=>{
    UNSUB.forEach(f=>f());UNSUB=[];
    document.querySelectorAll('.ov').forEach(o=>o.remove());
    if(!u){MSGS={};APPROVALS={};PRESETS={};ME_EMAIL='';REF=null;PREF=null;UID=null;PROFILES={};ADMIN=false;PLAYERS=[];ROSTERS={};ROSTER={};$('tab-admin').hidden=true;view='map';gate('修仙錄','請用管理者給你的帳號密碼登入。',true);return;}
    gate('修仙錄','正在讀取修煉進度…',false);
    ME_NAME=(u.email||'').split('@')[0];
    applyContent(DEFAULT_CONTENT);CONTENT_AT='';
    try{const cs=await FS.collection('config').doc('content').get();
      if(cs.exists&&cs.data().json){const c=JSON.parse(cs.data().json);if(!checkContent(c).length){applyContent(c);CONTENT_AT=cs.data().updatedAt||'';}}}catch(e){}
    REF=FS.collection('players').doc(u.uid);UID=u.uid;PREF=FS.collection('profiles').doc(u.uid);
    try{const snap=await REF.get();S=snap.exists?Object.assign(fresh(),snap.data()):fresh();}
    catch(e){return gate('讀取失敗','無法讀取存檔（'+(e.code||e.message)+'）。請重新整理，或請管理者確認 Firestore 規則。',false);}
    delete S.updatedAt;delete S.name;
    try{const rs=await FS.collection('roster').doc(u.uid).get();ROSTER=rs.exists?rs.data():{};}catch(e){ROSTER={};}
    ME_EMAIL=(u.email||'').toLowerCase();let PRE={};
    try{const ps=await FS.collection('presets').doc(ME_EMAIL).get();PRE=ps.exists?ps.data():{};}catch(e){PRE={};}
    ROSTER={...ROSTER,sect:ROSTER.sect||PRE.sect||'',school:ROSTER.school||PRE.school||'',schools:schoolsOf(ROSTER).length?schoolsOf(ROSTER):schoolsOf(PRE),rank:ROSTER.rank||PRE.rank||''};
    if(PRE.updatedAt&&PRE.updatedAt!==S.presetAt){S.presetAt=PRE.updatedAt;if(PRE.nick)S.nick=PRE.nick;if(PRE.senior)S.senior=true;if((PRE.teach||[]).length||PRE.spec)S.prof={...(S.prof||{}),...((PRE.teach||[]).length?{teach:PRE.teach}:{}),...(PRE.spec?{spec:PRE.spec}:{})};
      if(PRE.sect)S.sect=PRE.sect;if(schoolsOf(PRE).length){S.schools=schoolsOf(PRE);S.school=S.schools[0];}
      log(`管理者已幫你登記好：${[SECTS[PRE.sect]&&SECTS[PRE.sect].n,schoolsOf(PRE).length?schoolNames(schoolsOf(PRE)):null,PRE.rank,PRE.senior&&'師兄姐'].filter(Boolean).join('、')||'基本資料'}。`);}
    migrate();
    try{ADMIN=(await FS.collection('admins').doc(u.uid).get()).exists;}catch(e){ADMIN=false;}
    $('tab-admin').hidden=!ADMIN;
    const adminRender=()=>{if(view==='admin'&&!(document.activeElement&&document.activeElement.closest('input,textarea,select')))render();};
    if(ADMIN){UNSUB.push(FS.collection('players').onSnapshot(q=>{PLAYERS=q.docs.map(x=>({id:x.id,d:x.data()}));adminRender();},()=>{}));
      UNSUB.push(FS.collection('roster').onSnapshot(q=>{q.docs.forEach(x=>{ROSTERS[x.id]=x.data();});adminRender();},()=>{}));
}
    UNSUB.push(FS.collection('presets').onSnapshot(q=>{PRESETS={};q.docs.forEach(x=>{PRESETS[x.id]=x.data();});if(view==='admin')adminRender();else if(['map','room','master','skill'].includes(view))render();},()=>{}));
    MSGS={};const onMsgs=q=>{q.docs.forEach(x=>{if(x.exists)MSGS[x.id]=x.data();});q.docChanges&&q.docChanges().forEach(c=>{if(c.type==='removed')delete MSGS[c.doc.id];});
      renderDock();if((view==='inbox'||view==='thread')&&!(document.activeElement&&document.activeElement.closest('textarea,select')))render();};
    UNSUB.push(FS.collection('approvals').onSnapshot(q=>{APPROVALS={};q.docs.forEach(x=>{APPROVALS[x.id]=x.data();});onApprovals();},()=>{}));
    UNSUB.push(FS.collection('messages').where('to','==',u.uid).onSnapshot(onMsgs,()=>{}));
    UNSUB.push(FS.collection('messages').where('from','==',u.uid).onSnapshot(onMsgs,()=>{}));
    UNSUB.push(FS.collection('profiles').onSnapshot(q=>{PROFILES={};q.docs.forEach(x=>{PROFILES[x.id]=x.data();});if(['map','room','master','skill','admin'].includes(view)&&!document.activeElement.closest('textarea,select'))render();},()=>{}));
    $('gate').hidden=true;$('app').hidden=false;
    if(!S.log.length)log('踏入山門。');
    save();publish();render();
    if(!mySect())pickSect();else if(!mySchool())pickSchool();
  });
}
