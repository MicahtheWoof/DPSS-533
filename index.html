<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>光道修仙錄</title>
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cubic11";src:url("fonts/Cubic_11.woff2") format("woff2");font-display:swap}
/* Layout: pixel-RPG night lab. Semester HUD on top, tabs below; every panel uses a stepped pixel border (box-shadow cross). Deliberately single dark theme. */
:root{
  --bg:#14112a; --panel:#221d3f; --panel2:#2c2650; --edge:#4a3f7a; --ink:#f4efe1; --dim:#a99fc9;
  --gold:#f2c14e; --jade:#4fd1a1; --blood:#ef5d5d; --mist:#7fb2ff; --beam:#ff3b5c;
  --f:"Cubic11","PingFang TC","Microsoft JhengHei",monospace;
  --pb:3px;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.75;-webkit-font-smoothing:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.appc{display:flex;flex-direction:column;gap:20px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--mist);outline-offset:4px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}
p{margin:0}

/* pixel border */
.box,.stat,.place,.mcard,.act,.btn,.node,.ovb,.pick button,.sum div,.week div,.login input,.filters button,.tabs button,.tag,.sched div,.scene.big{
  --c:var(--edge);border:0;
  box-shadow:0 calc(-1*var(--pb)) 0 0 var(--c),0 var(--pb) 0 0 var(--c),calc(-1*var(--pb)) 0 0 0 var(--c),var(--pb) 0 0 0 var(--c),var(--ins,0 0 0 0 transparent);}
.tag,.sched div{--pb:2px}

.top{display:flex;flex-direction:column;gap:12px;text-align:center}
.sect{color:var(--dim);letter-spacing:.3em;font-size:12px}
.date{font-size:36px;line-height:1.3;color:var(--gold);text-shadow:3px 3px 0 #5a3d0c}
.date small{display:block;font-size:12px;color:var(--dim);text-shadow:none;letter-spacing:.1em}
.me{font-size:16px;color:var(--mist);display:flex;justify-content:center;align-items:flex-end;gap:8px}
.tl{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;padding-top:6px}
.tl div{height:9px;background:var(--edge);position:relative}
.tl div.past{background:#8a6a24}.tl div.now{background:var(--gold)}
.tl div.ev::after{content:"";position:absolute;left:50%;top:-6px;width:3px;height:3px;background:var(--beam);transform:translateX(-50%)}
.tll{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;font-size:12px;color:var(--dim);white-space:nowrap;text-align:left}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:3px}
.week div{background:var(--panel);padding:6px 2px;font-size:12px;text-align:center;line-height:1.5}
.week div b{display:block;font-size:16px;font-weight:400}
.week div.past{opacity:.4}.week div.now{--c:var(--gold);background:var(--panel2);color:var(--gold)}
.week i{font-style:normal;font-size:12px;color:var(--beam)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:3px}
.stat{background:var(--panel);padding:8px 12px;min-width:0}
.stat span{font-size:12px;color:var(--dim)}
.stat b{display:block;font-weight:400;font-size:24px;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:6px;background:var(--bg);overflow:hidden;margin-top:4px}
.bar div{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 8px)}
.tabs{display:flex;gap:12px;flex-wrap:wrap;padding:3px}
.tabs button{background:var(--panel);padding:6px 14px;font-size:16px;color:var(--dim)}
.tabs button[aria-selected="true"]{--c:var(--gold);background:var(--gold);color:var(--bg)}
.box{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;margin:3px}
.box h2{font-size:24px;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;line-height:1.3}
.box h2 em{font-style:normal;font-size:12px;color:var(--dim)}
.box h3{font-size:16px;color:var(--dim)}
.muted{color:var(--dim);font-size:12px;line-height:1.8}
.scene{display:block;width:100%;height:auto;aspect-ratio:2/1;max-width:100%}
.scene.big{max-width:512px;align-self:center;margin:3px auto}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:3px}
.place{text-align:left;background:var(--panel2);padding:0 0 10px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.place>*:not(canvas){padding-inline:10px}
.place canvas{margin-bottom:4px}
.place:hover{--c:var(--gold)}
.place b{font-weight:400;font-size:16px;color:var(--gold)}
.place span{font-size:12px;color:var(--dim);line-height:1.6}
.place .who{color:var(--mist)}
.main{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.mcard{background:var(--panel2);padding:12px;display:flex;flex-direction:column;gap:10px;margin:3px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.mname{display:flex;align-items:flex-end;gap:10px}
.mname b{font-weight:400;font-size:16px;color:var(--ink)}
.mcard .spr{animation:bob 1.2s steps(1) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.spr{display:inline-block;flex:none}
.tag{display:inline-block;font-size:12px;padding:0 6px;color:var(--dim);white-space:nowrap;margin:2px;line-height:1.6;background:var(--bg)}
.tag.pqs{--c:#e07b39;color:#f0a77a}.tag.aqs{--c:#4f7be0;color:#a9bbff}.tag.raman{--c:#3fb27f;color:#86dcbb}
.tag.share{--c:var(--gold);color:var(--gold)}.tag.ext{--c:#8f6ad8;color:#c8b2f2}
.acts{display:flex;flex-direction:column;gap:10px;padding:3px}
.act{text-align:left;background:var(--panel);padding:8px 12px;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;--ins:inset 0 -3px 0 0 rgba(0,0,0,.3)}
.act:hover:not(:disabled){--c:var(--gold)}
.act:active:not(:disabled){transform:translateY(2px)}
.act:disabled{opacity:.45;cursor:default}
.act small{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lock{font-size:12px;color:var(--dim);line-height:1.8}
.away{font-size:12px;color:var(--dim);border-left:3px solid var(--blood);padding-left:10px}
.btn{background:var(--panel2);--c:var(--gold);color:var(--gold);padding:8px 18px;font-size:16px;--ins:inset 0 -3px 0 0 rgba(0,0,0,.35);margin:3px}
.btn:hover:not(:disabled){background:#3a3166}
.btn:active:not(:disabled){transform:translateY(2px)}
.log{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--dim);margin:0;padding:0;list-style:none;line-height:1.8}
.log li{border-bottom:2px dashed var(--edge);padding-bottom:6px}
.log li b{color:var(--ink);font-weight:400}
.log time{color:var(--mist);margin-right:6px}
.filters{display:flex;gap:12px;flex-wrap:wrap;padding:3px}
.filters button{background:var(--panel2);padding:2px 12px;font-size:12px}
.filters button[aria-pressed="true"]{--c:var(--gold);color:var(--gold)}
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:3px}
.tier{display:flex;flex-direction:column;gap:12px;min-width:0}
.tier h3{font-size:12px;color:var(--dim);letter-spacing:.15em}
.node{background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.7}
.node b{font-weight:400;font-size:16px;line-height:1.4}
.node.dim{opacity:.22}
.node.done{--c:var(--jade)}
.node.open{--c:var(--gold)}
.node .st.done{color:var(--jade)}.node .st.open{color:var(--gold)}.node .st.lockd{color:var(--dim)}
.node .pr{color:var(--dim)}
.node .tags{display:flex;flex-wrap:wrap;margin:2px -2px 0}
.masters{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sched{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;font-size:12px;text-align:center;padding:2px}
.sched div{background:var(--panel);padding:2px;line-height:1.6}
.sched div b{display:block;color:var(--dim);font-weight:400}
.sched div.today{--c:var(--gold)}
.aff{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.aff .bar{flex:1;margin:0}
.aff .bar div{background:repeating-linear-gradient(90deg,var(--mist) 0 6px,transparent 6px 8px)}
.teach{font-size:12px;color:var(--dim);line-height:1.8}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,8,22,.9);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovb{--c:var(--gold);width:min(620px,calc(100% - 6px));max-height:calc(100% - 6px);overflow-y:auto;background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px}
.ovb h1{font-size:24px;color:var(--gold);text-align:center;line-height:1.4}
.ovb h2{font-size:16px;color:var(--ink);font-weight:400}
.hero{display:flex;justify-content:center}
.pick{display:flex;flex-direction:column;gap:14px;padding:3px}
.pick button{text-align:left;background:var(--panel2);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pick button:hover{--c:var(--gold)}
.pick b{font-weight:400;font-size:16px;color:var(--gold)}
.pick span{font-size:12px;color:var(--dim)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;padding:3px}
.sum div{background:var(--panel2);padding:10px}
.sum b{display:block;font-weight:400;font-size:24px;color:var(--gold)}
.sum span{font-size:12px;color:var(--dim)}
.gate{max-width:560px;width:calc(100% - 6px);margin:8vh auto 0;text-align:center;align-items:center}
.gate h1{font-size:36px;color:var(--gold);text-shadow:3px 3px 0 #5a3d0c}
.gate-art{width:100%;display:flex;justify-content:center}
.login{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;text-align:left}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim)}
.login input{background:var(--bg);padding:8px 12px;font-size:16px;margin:3px}
.login input:focus{--c:var(--gold);outline:none}
.err{color:var(--blood);font-size:12px;min-height:1.5em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row input[type=file]{display:none}
.ptable{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:left;padding:8px 10px;border-bottom:2px dashed var(--edge);white-space:nowrap}
.ptable th{color:var(--dim);font-weight:400}
.ptable td:first-child{color:var(--ink);font-size:16px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12px}
.link:hover{color:var(--gold)}
@media (max-width:820px){.main{grid-template-columns:1fr}.tree{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.tree{grid-template-columns:1fr}.date{font-size:24px}.gate h1{font-size:24px}.places{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.room,.chip,.sw,.bookopt,.dk.on{--c:var(--edge);border:0;box-shadow:0 calc(-1*var(--pb)) 0 0 var(--c),0 var(--pb) 0 0 var(--c),calc(-1*var(--pb)) 0 0 0 var(--c),var(--pb) 0 0 0 var(--c)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);box-shadow:0 -3px 0 0 var(--edge),0 -9px 0 0 rgba(10,8,22,.6);
  display:grid;grid-template-columns:repeat(5,minmax(0,120px));justify-content:center;gap:8px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dk{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;font-size:12px;color:var(--dim)}
.dk.on{--c:var(--gold);background:var(--panel2);color:var(--gold)}
.dk:disabled{opacity:.35;cursor:default}
.dk:not(:disabled):hover{color:var(--ink)}
.ico{display:block}
.floor{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.flabel{background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px}
.fbody{display:flex;flex-direction:column;min-width:0}
.rooms{display:flex;flex-wrap:wrap;gap:14px;padding:6px 3px 12px;align-items:flex-end}
.suite{display:flex;flex-wrap:wrap;gap:14px;padding:24px 10px 10px;position:relative;outline:3px dashed rgba(242,193,78,.45);outline-offset:-3px}
.suite-n{position:absolute;top:3px;left:10px;font-size:12px;color:var(--gold)}
.room{width:150px;max-width:100%;text-align:left;background:var(--panel2);padding:0 0 8px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.room>*:not(canvas){padding-inline:8px}
.room canvas{margin-bottom:4px}
.room b{font-weight:400;color:var(--gold);font-size:16px}
.room .who{font-size:12px;color:var(--mist);line-height:1.5}
.room:hover{--c:var(--gold)}
.room.blocked{opacity:.6}.room.blocked .who{color:var(--blood)}
.hall{height:16px;background:repeating-linear-gradient(90deg,#3a3060 0 12px,#332a56 12px 24px);font-size:12px;color:var(--dim);line-height:16px;padding-left:8px}
.lookmain{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;align-items:start}
.lookstage{position:sticky;top:12px}
.pedestal{display:flex;justify-content:center;padding:20px 0 0;background:linear-gradient(transparent 82%,var(--panel2) 82%)}
.chips{display:flex;flex-wrap:wrap;gap:12px;padding:3px}
.chip{background:var(--panel2);padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;min-width:76px}
.chip.on{--c:var(--gold);color:var(--gold)}
.chip:hover{--c:var(--mist)}
.swatches{display:flex;gap:14px;flex-wrap:wrap;padding:3px}
.sw{width:30px;height:30px;padding:0}
.sw.on{--c:var(--gold);--pb:4px}
.books{display:flex;flex-direction:column;gap:12px;padding:3px}
.bookopt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);padding:8px 10px}
.bookopt.on{--c:var(--gold)}
.bookopt:hover{--c:var(--mist)}
.cover{width:18px;height:24px;flex:none;background:var(--edge);box-shadow:inset -3px 0 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.2)}
.bt{display:flex;flex-direction:column;min-width:0}
.bt b{font-weight:400;font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.bt small{font-size:12px;color:var(--dim)}
.bookfx{font-size:12px;color:var(--gold);text-align:center}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:3px}
@media (max-width:820px){.lookmain{grid-template-columns:1fr}.lookstage{position:static}}
@media (max-width:520px){.floor{grid-template-columns:32px minmax(0,1fr);gap:8px}.room{width:calc(50% - 7px)}.suite .room{width:100%}.dock{gap:4px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<canvas id="stars"></canvas>
<div class="wrap">
  <section class="box gate" id="gate">
    <div class="sect">五三三 · 光學宗</div>
    <div class="gate-art" id="gate-art"></div>
    <h1 id="gate-t">光道修仙錄</h1>
    <p class="muted" id="gate-d">正在連線…</p>
    <form class="login" id="login" hidden>
      <label for="lg-user">帳號<input id="lg-user" autocomplete="username" autocapitalize="off" required></label>
      <label for="lg-pass">密碼<input id="lg-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn" id="lg-btn" type="submit">登入</button>
      <p class="err" id="lg-err"></p>
    </form>
  </section>
  <div class="appc" id="app" hidden>
  <section class="top">
    <div class="sect">五三三 · 光學宗</div>
    <div class="date" id="date">第 1 週 · 週一</div>
    <div class="me" id="me"></div>
    <div><button class="btn" id="tab-admin" hidden>弟子總覽（管理者）</button></div>
    <div>
      <div class="tl" id="tl"></div>
      <div class="tll"><span style="grid-column:1/3">開學</span><span style="grid-column:8/11;text-align:center">期中</span><span style="grid-column:16/18;text-align:right">期末</span><span style="grid-column:18/19;text-align:right">發表</span></div>
    </div>
    <div class="week" id="week"></div>
  </section>
  <section class="stats">
    <div class="stat"><span>派系</span><b id="s-school">未入門</b></div>
    <div class="stat"><span>出師進度</span><b id="s-path">0 / 0</b><div class="bar"><div id="s-pathbar"></div></div></div>
    <div class="stat"><span>實驗成果</span><b id="s-res">0</b></div>
    <div class="stat"><span>下次組會</span><b id="s-meet">—</b></div>
  </section>
  <div id="view"></div>
  <div class="foot"><span>樣本原型：師父名號、派系、功法與作息皆為範例，可換成 533 的實際內容。進度存在你的帳號，換裝置登入也能接著玩。</span><span id="savest"></span><span class="row"><button class="link" id="nick">改名稱</button><button class="link" id="pw">改密碼</button><button class="link" id="logout">登出</button><button class="link" id="reset">重新開始</button></span></div>
  <nav class="dock" id="dock" aria-label="主選單"></nav>
  </div>
</div>

<script>
/* ===================== 可編輯資料區 ===================== */
// 地點
let PLACES={
  big:{n:'大間休息室',d:'人最多，午餐時間特別熱鬧。',art:'lounge',floor:5,group:'533'},
  small:{n:'小間休息室',d:'比較安靜，常有人在讀 paper、推公式。',art:'study',floor:5,group:'533'},
  friend:{n:'606實驗室',d:'友好的 606 實驗室，有我們沒有的專長。',art:'door',num:'606',floor:6},
  lab:{n:'524實驗室',d:'有光學桌的實驗室。可協助師父做實驗，或自己動手。',lab:true,art:'lab',num:'524',beam:'#ff3b5c',floor:5},
  r526:{n:'526實驗室',d:'有光學桌的實驗室。可協助師父做實驗，或自己動手。',lab:true,art:'lab',num:'526',beam:'#4dff6a',floor:5},
  r527:{n:'527實驗室',d:'有光學桌的實驗室。可協助師父做實驗，或自己動手。',lab:true,art:'lab',num:'527',beam:'#ffd23f',floor:5},
  desk:{n:'自己的座位',d:'安靜讀書、看課本與 paper。',art:'desk',floor:5,group:'533'}
};
// 派系：final 是出師要練成的功法，其前置知識會自動展開

  return {books:BOOKS,places:strip(PLACES),schools:strip(SCHOOLS),skills:strip(SKILLS),masters:strip(MASTERS),away:AWAY,exam:EXAM,advAff:ADV_AFF};}
function checkContent(c){const e=[];
  if(!c||typeof c!=='object')return['不是 JSON 物件'];
  for(const k of['places','schools','skills','masters'])if(!c[k])e.push('缺少 '+k);
  if(e.length)return e;
  const ids=new Set(c.skills.map(s=>s.id));
  c.skills.forEach(s=>(s.pre||[]).forEach(p=>{if(!ids.has(p))e.push(`功法 ${s.id} 的前置 ${p} 不存在`);}));
  for(const k in c.schools)if(!ids.has(c.schools[k].final))e.push(`派系 ${k} 的 final ${c.schools[k].final} 不存在`);
  c.masters.forEach(m=>{(m.teach||[]).forEach(t=>{if(!ids.has(t))e.push(`師父 ${m.n} 教的 ${t} 不存在`);});
    for(const d in (m.sched||{}))if(!c.places[m.sched[d]])e.push(`師父 ${m.n} 週${d} 的地點 ${m.sched[d]} 不存在`);
    if(m.school&&!c.schools[m.school])e.push(`師父 ${m.n} 的派系 ${m.school} 不存在`);});
  if(!e.length){const seen=new Set(),stack=new Set();const byId=Object.fromEntries(c.skills.map(s=>[s.id,s]));
    const dfs=id=>{if(stack.has(id))return e.push('功法前置形成循環：'+id);if(seen.has(id))return;stack.add(id);(byId[id].pre||[]).forEach(dfs);stack.delete(id);seen.add(id);};
    c.skills.forEach(s=>dfs(s.id));}
  return e;}

function renderContentBox(){

let skillMode='list';
function renderSkills(){
  const all=SKILLS.filter(s=>!s.auto||learned(s.id));
  const done=all.filter(s=>learned(s.id)),open=all.filter(s=>!learned(s.id)&&preOK(s)),locked=all.filter(s=>!learned(s.id)&&!preOK(s));
  const head=h('section',{class:'box'},h('h2',{},'功法',h('em',{},`已習得 ${done.length} · 可修習 ${open.length} · 未解鎖 ${locked.length}`)),
    h('div',{class:'filters'},...[['list','清單'],['tree','圖譜']].map(([k,n])=>h('button',{'aria-pressed':String(skillMode===k),onclick:()=>{skillMode=k;render();}},n))));
  if(skillMode==='tree')return h('div',{class:'col'},head,renderTree());
  const mine=S.school?SCHOOLS[S.school].need:new Set();

    const where=s.by.map(m=>{const days=Object.keys(m.sched).map(d=>DAYS[d]+(PLACES[m.sched[d]]?PLACES[m.sched[d]].n.replace('休息室','').replace('實驗室',''):'')).join(' ');return`${m.n}（${days||'不定'}）`;}).join('、');

      h('span',{class:'st '+st},st==='done'?'已習得':st==='open'?`可修習 · ${p}/${s.cost}`:'尚未解鎖'),
      st==='open'&&s.cost?h('div',{class:'bar'},h('div',{style:`width:${p/s.cost*100}%`})):null,
      s.pre.length?h('span',{class:'pr'},'前置：'+s.pre.map(x=>(learned(x)?'✓':'')+SK[x].n).join('、')):null,
      !s.auto?h('span',{class:'pr'},'找誰學：'+(where||'—')+(s.book?'；也可以自修':'')):h('span',{class:'pr'},s.d||''),
      BOOKS.some(b=>b.id!=='none'&&b.skills.includes(s.id))?h('span',{class:'pr'},'推薦教科書：'+BOOKS.filter(b=>b.skills.includes(s.id)).map(b=>b.short||b.n).join('、')):null);};

const CFG=window.FIREBASE_CONFIG||{};
const DOMAIN=window.LOGIN_DOMAIN||'lab533.example.com';
const toEmail=u=>(u=u.trim(),u.includes('@')?u:u.toLowerCase()+'@'+DOMAIN);
const ERR={'auth/invalid-credential':'帳號或密碼不正確。','auth/wrong-password':'帳號或密碼不正確。','auth/user-not-found':'帳號或密碼不正確。',
  'auth/invalid-email':'帳號格式不正確。','auth/too-many-requests':'嘗試太多次，請稍後再試。','auth/network-request-failed':'網路連線失敗，請檢查網路。',
